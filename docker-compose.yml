# MeshDepot - the whole deployment: one service, one volume.
#
# It runs as it is, and it is meant to be read: every setting says what it does
# and whether it is required.
#
#   cp .env.example .env
#   echo "APP_KEY=$(openssl rand -base64 32)" >> .env
#   docker compose up --build -d
#
# The app is then served on http://localhost:9000 (default admin: admin/admin -
# it asks for a new password on the first login).

services:

  app:
    # No image is published, so the container is built from this checkout. The
    # build compiles the Go binary and bakes the SPA into it, which is why any
    # frontend change needs `up --build`, not just a restart.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meshdepot:latest
    container_name: meshdepot
    restart: unless-stopped

    # The container shares the host's network stack: no bridge, no NAT, no port
    # mapping. `ports:` is therefore gone - Compose rejects it together with
    # network_mode, and there would be nothing left to map. There is no separate
    # container-side port either: every port below is a host port.
    #
    # What this exposes: the container's own loopback services are now the
    # host's. All four sit in one contiguous block from 9000 so they are easy to
    # keep clear, and each can be moved on its own if something is already there.
    # The three internal ones stay on loopback, so nothing outside this machine
    # reaches them.
    network_mode: host

    # Values from .env are read automatically. The file is optional: everything
    # below has a default or a value of its own, except APP_KEY.
    env_file:
      - path: .env
        required: false

    # Every entry below says whether it is required or optional. "Optional" means
    # the line can be deleted and the app still starts with the default named.
    environment:
      # - Required - the app does not start without these two ---------
      # APP_KEY derives the per-user AES-256 key that encrypts all stored
      # platform credentials. There is deliberately no default: the app refuses
      # to start without one, and the `:?` below turns that into an immediate
      # Compose error instead of a container stuck in a restart loop.
      # Generate with:  openssl rand -base64 32
      # Changing it after the first start makes every stored credential
      # unreadable - users then have to re-enter their platform logins.
      - APP_KEY=${APP_KEY:?APP_KEY must be set in .env (>= 32 random characters, e.g. openssl rand -base64 32)}

      # Listen address of the HTTP server. The image sets no default on purpose:
      # this is the deployment's decision. With host networking this binds
      # straight onto the host, so APP_PORT is both the listen port and the one
      # you browse to. Delete this line and the app logs a fatal and stops -
      # better than a container that looks broken for no visible reason.
      #
      # Behind a reverse proxy, bind to loopback so the app is not reachable
      # from the network directly:
      #   - HTTP_ADDR=127.0.0.1:${APP_PORT:-9000}
      - HTTP_ADDR=:${APP_PORT:-9000}

      # - Optional: reverse proxy / TLS --------------------
      # Default false. Set to true when a TLS-terminating proxy sits in front:
      # it enables Secure cookies and HSTS. Leave it false for plain
      # http://localhost, otherwise the browser drops the session cookie and the
      # login fails silently.
      - APP_HTTPS=${APP_HTTPS:-false}
      # Default empty. Single allowed CORS origin, e.g. https://meshdepot.example.com.
      # Empty means "no CORS headers at all", which is correct when the SPA is
      # served from the same origin as the API - the normal case.
      - APP_URL=${APP_URL:-}

      # - Optional: operations ------------------------
      # none | error | warning | info | all. Set to `error` here for production
      # use; the app's own default is `all`. `info` adds the ordinary course of
      # events - startup, sync runs, downloads - and `all` the traces that are
      # only useful while chasing something down.
      #
      # It covers the Firefox resolver in the same container as well. What it
      # never silences is a startup failure: a container that refuses to run
      # says why at every level.
      - LOG_LEVEL=${LOG_LEVEL:-error}
      # Drives the scheduler's wall-clock decisions and log timestamps. The image
      # sets no timezone, so without this the container runs on UTC.
      - TZ=${TZ:-Europe/Berlin}

      # Optional, but set it as soon as a reverse proxy sits in front: otherwise
      # every request carries the proxy's address, and the login rate limit counts
      # all users as a single client. Comma-separated IPs or CIDRs. With host
      # networking a proxy on this machine arrives as 127.0.0.1, not as a Docker
      # bridge address.
      #   - TRUSTED_PROXIES=127.0.0.1/32

      # - Optional: the three internal ports -----------------
      # These are the services that run inside the container and, because it
      # shares the host's network stack, bind on the host. They are kept on
      # 127.0.0.1 deliberately: nothing outside this machine may reach them.
      # Change one only when the port is already taken on the host.

      # The Firefox resolver that fetches captcha-gated download URLs. It ships
      # in the image (this used to be a separate `playwright` service); the
      # entrypoint starts it on this address and generates its token, and the app
      # refuses to start if it does not answer. This one value moves both ends -
      # an *empty* value aborts the container. Point it at a host other than
      # 127.0.0.1 only to use a resolver of your own, and then set
      # PLAYWRIGHT_TOKEN to match it.
      - PLAYWRIGHT_URL=http://127.0.0.1:${RESOLVER_PORT:-9001}

      # The bundled Tor daemon: SOCKS5 proxy and control port. Only Printables
      # downloads use them. The defaults deliberately avoid Tor's usual
      # 9050/9051, which would collide with a Tor already running on the host.
      - TOR_SOCKS_ADDR=127.0.0.1:${TOR_SOCKS_PORT:-9002}
      - TOR_CONTROL_ADDR=127.0.0.1:${TOR_CONTROL_PORT:-9003}

      # How long the MakerWorld resolver keeps its warm Firefox alive with no
      # work, in milliseconds. Default 15 minutes. Lower it to free the memory
      # sooner, raise it if a long queue keeps re-warming the browser.
      - MAKERWORLD_IDLE_MS=${MAKERWORLD_IDLE_MS:-900000}

      # - Nothing to configure here ----------------------
      # Nothing to configure for the platforms: every token and login belongs to
      # a user and is entered in the web UI, not here. There is no server-wide
      # fallback token (see PlatformToken in internal/platforms/helpers.go).

    # Required. Everything that must survive a rebuild lives here: the SQLite
    # database, model files, blobs, covers, thumbnails, avatars. Without it every
    # recreate starts empty.
    volumes:
      # Back up this volume and you have backed up the installation.
      #
      # To keep the data in a host directory instead of a named volume, replace
      # the line below with a bind mount, e.g.:
      #   - ./data:/data
      - meshdepot_data:/data

    # Optional: it only decides whether Docker calls the container healthy.
    healthcheck:
      # Hits the SPA root rather than /api/v1/health: it proves the HTTP server
      # is up without depending on the API's auth layer. Same APP_PORT as
      # HTTP_ADDR above.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${APP_PORT:-9000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: migrations on first start, plus Xvfb and the Node resolver
      # coming up before the app listens.
      start_period: 60s

    # Optional.
    logging:
      # One process means one log stream; caps keep it from filling the disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Optional, but do not go much lower. Since the resolver moved in, the app,
    # Firefox and up to two rod Chromium instances share one limit. Below ~4g the
    # OOM killer picks a victim during parallel downloads.
    mem_limit: 4g

    # Effectively required. Firefox needs shared memory; on the 64 MB default its
    # pages crash under load and every download that needs a browser fails.
    shm_size: 1g

    # Optional hardening. Nothing in the container escalates privileges.
    security_opt:
      - no-new-privileges:true

# The `playwright` sidecar service that used to live here is gone: the resolver
# is part of the app image now (see backend/Dockerfile, stage 4). There is
# nothing left to enable, no profile to pass and no token to share.

volumes:
  meshdepot_data:
