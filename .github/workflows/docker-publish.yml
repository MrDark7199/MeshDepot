name: Build and publish image

# Builds the container image and pushes it to the GitHub Container Registry
# (GHCR) so a registry-based deploy (e.g. Portainer) can just pull it, instead
# of trying to pull a locally-built image that lives in no registry.
#
# One-time after the first successful run: make the package public at
#   https://github.com/users/MrDark7199/packages/container/meshdepot/settings
# (Danger Zone -> Change visibility -> Public), so Portainer can pull it without
# registry credentials. Otherwise add a GHCR pull secret (read:packages) in
# Portainer.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mrdark7199/meshdepot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
